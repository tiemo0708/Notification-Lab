    systemProperty 'campaign.delivery.publishBatchSize', providers.gradleProperty('publishBatchSize').getOrElse('1')
    outputs.upToDateWhen { false }
    testLogging { events 'passed', 'skipped', 'failed'; showStandardStreams = true }
}

