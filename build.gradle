tasks.register('apiDbObservationPilot', Test) {
    description = 'Bounded same-session DB observation during a 1k admission pilot; ON/OFF sampler control'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'campaign-delivery-pilot' }
    maxHeapSize = '512m'
    maxParallelForks = 1
    timeout = Duration.ofMinutes(25)
    systemProperty 'junit.jupiter.execution.timeout.test.method.default', '20m'
    systemProperty 'campaign.delivery.targets', '1000'
    systemProperty 'campaign.delivery.load', 'false'
    systemProperty 'campaign.delivery.scaling', 'true'
    systemProperty 'campaign.delivery.relayInstances', '2'
    systemProperty 'campaign.delivery.publishBatchSize', '10'
    systemProperty 'campaign.delivery.fineTiming', 'true'
    systemProperty 'campaign.delivery.offsetComparison', 'true'
    systemProperty 'campaign.delivery.offsetMode', 'COUNT_TIME'
    systemProperty 'campaign.delivery.apiTiming', 'true'
    systemProperty 'campaign.delivery.dbObservation', 'true'
    def sampler = providers.gradleProperty('dbObservation').getOrElse('ON')
    if (!(sampler in ['ON', 'OFF'])) throw new GradleException('dbObservation must be ON or OFF')
    systemProperty 'campaign.delivery.dbObserveEnabled', (sampler == 'ON').toString()
    def minimumCallMillis = providers.gradleProperty('dbMinCallMillis').getOrElse('0')
    if (!(minimumCallMillis in ['0', '20'])) throw new GradleException('dbMinCallMillis must be 0 or 20')
    systemProperty 'campaign.delivery.dbMinCallMillis', minimumCallMillis
    outputs.upToDateWhen { false }
    testLogging { events 'passed', 'skipped', 'failed'; showStandardStreams = true }
}

