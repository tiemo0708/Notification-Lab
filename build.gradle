plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
}

group = 'dev.jinhyeon'
version = '0.3.0-SNAPSHOT'
description = 'Local notification delivery and traffic-management learning project'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Keep the existing Spring Boot BOM versions during the build-tool migration.
    implementation enforcedPlatform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)

    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.batch:spring-batch-core'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.kafka:spring-kafka'
    implementation 'org.apache.httpcomponents.client5:httpclient5'
    implementation 'redis.clients:jedis'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'com.mysql:mysql-connector-j'

    testImplementation('org.springframework.boot:spring-boot-starter-test') {
        // Tests use real objects and hand-written fakes; no JVM attach agent is needed.
        exclude group: 'org.mockito', module: 'mockito-core'
        exclude group: 'org.mockito', module: 'mockito-junit-jupiter'
    }
    testImplementation 'org.testcontainers:kafka'
    testImplementation 'org.testcontainers:mysql'
    testImplementation 'org.testcontainers:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test') {
    useJUnitPlatform { excludeTags 'reconciliation', 'campaign-load', 'campaign-delivery-pilot', 'outbox-query-probe', 'outbox-statistics-probe', 'outbox-lock-probe', 'api-wait-probe', 'api-failure-persistence', 'api-failure-pilot-controls' }
    doFirst {
        // The process-crash experiment forks a test-only Spring Boot entry point.
        systemProperty 'notificationLab.testClasspath', sourceSets.test.runtimeClasspath.asPath
    }
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

// This repository distributes an executable Spring Boot application, not a library.
tasks.named('jar') {
    enabled = false
}

// Explicit 10,000-request correctness experiment; kept out of the fast regression suite.
tasks.register('reconciliationTest', Test) {
    description = 'Reconcile 10,000 HTTP requests through real MySQL and Kafka'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'reconciliation' }
    testLogging { events 'passed', 'skipped', 'failed'; showStandardStreams = true }
    shouldRunAfter test
}

// Standalone local HTTP provider simulator; excluded from the notification application's JAR/scan.
sourceSets {
    mockServer
}
configurations {
    mockServerImplementation.extendsFrom implementation
    mockServerRuntimeOnly.extendsFrom runtimeOnly
}
dependencies {
    testImplementation sourceSets.mockServer.output
}
tasks.register('mockServer', JavaExec) {
    group = 'application'
    description = 'Run the local HTTP mock provider on 127.0.0.1:18081'
    classpath = sourceSets.mockServer.runtimeClasspath
    mainClass = 'dev.jinhyeon.notificationmock.MockServerApplication'
}
tasks.register('mockServerJar', org.springframework.boot.gradle.tasks.bundling.BootJar) {
    group = 'build'
    archiveClassifier = 'http-mock'
    targetJavaVersion = JavaVersion.VERSION_21
    mainClass = 'dev.jinhyeon.notificationmock.MockServerApplication'
    classpath = sourceSets.mockServer.runtimeClasspath
}
tasks.named('assemble') { dependsOn tasks.named('mockServerJar') }

// Explicit single-campaign expansion; bootRun never launches a campaign job automatically.
tasks.register('campaignBatch', JavaExec) {
    group = 'application'
    description = 'Expand one START_REQUESTED campaign into durable Outbox work'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'dev.jinhyeon.notificationlab.campaign.batch.CampaignBatchCommand'
}
springBoot {
    mainClass = 'dev.jinhyeon.notificationlab.NotificationLabApplication'
}

// Opt-in: real durable campaign expansion, separate from the default regression suite.
tasks.register('campaignLoadTest', Test) {
    description = 'Measure one isolated campaign DB handoff (default 100,000 targets)'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'campaign-load' }
    maxHeapSize = '512m'
    maxParallelForks = 1
    timeout = Duration.ofHours(2)
    systemProperty 'campaign.load.targets', providers.gradleProperty('campaignTargets').getOrElse('100000')
    systemProperty 'campaign.load.output', layout.buildDirectory.dir('reports/campaign-load').get().asFile.absolutePath
    outputs.upToDateWhen { false }
    testLogging { events 'passed', 'skipped', 'failed'; showStandardStreams = true }
}

