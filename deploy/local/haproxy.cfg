global
    maxconn 64

defaults
    mode http
    retries 0
    timeout connect 500ms
    timeout client 5s
    timeout server 5s
    timeout queue 1s
    timeout check 500ms
    option http-server-close

frontend notifications
    bind :8080
    default_backend api_nodes

backend api_nodes
    balance roundrobin
    option httpchk
    http-check send meth GET uri /actuator/health ver HTTP/1.1 hdr Host localhost
    http-check expect status 200
    http-response set-header X-Notification-Lab-Upstream %[srv_name]
    server api1 host.docker.internal:18010 check inter 200ms fall 2 rise 1 maxconn 16 maxqueue 16
    server api2 host.docker.internal:18011 check inter 200ms fall 2 rise 1 maxconn 16 maxqueue 16

listen local_stats
    bind :8404
    stats enable
    stats uri /stats
    stats refresh 2s
