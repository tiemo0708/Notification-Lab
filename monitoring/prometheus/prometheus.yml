global:
  scrape_interval: 5s
  scrape_timeout: 3s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: notification-lab
    metrics_path: /actuator/prometheus
    body_size_limit: 2MB
    sample_limit: 10000
    label_limit: 20
    label_value_length_limit: 200
    static_configs:
      - targets: [host.docker.internal:8080]
        labels:
          lane: REALTIME
      - targets: [host.docker.internal:8082]
        labels:
          lane: CAMPAIGN
