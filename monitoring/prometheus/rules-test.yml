{
  "rule_files": [
    "rules.yml"
  ],
  "evaluation_interval": "5s",
  "tests": [
    {
      "name": "healthy-zero-lag-is-not-an-error",
      "interval": "5s",
      "input_series": [
        {
          "series": "up{job=\"notification-lab\",instance=\"one\",lane=\"REALTIME\"}",
          "values": "1+0x12"
        },
        {
          "series": "outbox_sample_age_seconds{job=\"notification-lab\",instance=\"one\",lane=\"REALTIME\"}",
          "values": "0+0x12"
        },
        {
          "series": "notification_consumer_sample_age_seconds{job=\"notification-lab\",instance=\"one\",lane=\"REALTIME\"}",
          "values": "0+0x12"
        },
        {
          "series": "notification_worker_running{job=\"notification-lab\",instance=\"one\",lane=\"REALTIME\"}",
          "values": "1+0x12"
        },
        {
          "series": "outbox_unpublished{job=\"notification-lab\",instance=\"one\",lane=\"REALTIME\"}",
          "values": "0+0x12"
        },
        {
          "series": "notification_consumer_lag{job=\"notification-lab\",instance=\"one\",lane=\"REALTIME\"}",
          "values": "0+0x12"
        }
      ],
      "alert_rule_test": [
        {
          "eval_time": "40s",
          "alertname": "NotificationTargetDown",
          "exp_alerts": []
        },
        {
          "eval_time": "40s",
          "alertname": "NotificationDbSampleUnavailable",
          "exp_alerts": []
        },
        {
          "eval_time": "40s",
          "alertname": "NotificationKafkaSampleUnavailable",
          "exp_alerts": []
        },
        {
          "eval_time": "40s",
          "alertname": "NotificationWorkerStopped",
          "exp_alerts": []
        }
      ]
    },
