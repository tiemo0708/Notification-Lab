app:
  traffic:
    lane: CAMPAIGN
    split-enabled: true
  rate-limit:
    client-enabled: true
  worker:
    consumers: 2
    max-active: 2
    # Only grouped success results on the idempotent HTTP Mock path use this option.
    campaign-completion-batch-enabled: true
  campaign:
    batch:
      # Applied only when the explicit command expands a selected campaign.
      grouped-outbox: true
