server:
  address: 127.0.0.1
  port: 8080
  shutdown: graceful
  tomcat:
    threads:
      max: 32
    accept-count: 64
    max-connections: 256

spring:
  application:
    name: notification-lab
  lifecycle:
    timeout-per-shutdown-phase: 10s
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:${MYSQL_PORT:13316}/notification_lab?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&connectTimeout=3000&socketTimeout=5000}
    username: ${MYSQL_USER:notification_lab}
    password: ${MYSQL_PASSWORD}
    hikari:
      maximum-pool-size: 8
      minimum-idle: 1
      connection-timeout: 3000
  task:
    scheduling:
      pool:
        size: 2
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:${KAFKA_PORT:19092}}
    admin:
      fail-fast: false
      properties:
        default.api.timeout.ms: 5000
        request.timeout.ms: 3000
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      buffer-memory: 1048576
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 1
        max.block.ms: 3000
        request.timeout.ms: 3000
        delivery.timeout.ms: 10000
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
      auto-offset-reset: earliest
      max-poll-records: 1
      properties:
        max.poll.interval.ms: 60000
        fetch.max.bytes: 1048576
        max.partition.fetch.bytes: 1048576
    listener:
      ack-mode: record
      log-container-config: false
  flyway:
    clean-disabled: true

app:
  delivery:
    # Counts all claims, including recovery after an uncertain provider outcome.
    max-attempts: 3
  async:
    topic: notification.requested.v1
    group: notification-worker-v1
    max-publish-attempts: 10
    relay-enabled: true
    worker-enabled: true
  # Local-only Mock; no real network push.
  mock:
    delay-ms: 100
    outcome: SUCCESS
  store:
    # Used only by the optional memory profile.
    max-records: 10000

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
